name: Update fighter records

on:
  schedule:
    - cron: "30 17 * * *" # 毎日 JST 2:30 (UTC 17:30)。0:17(org-rankings)・8:00(daily-digest)と非衝突
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Check ranking freeze flag
        id: freeze_check
        run: |
          FROZEN=$(node -e "console.log(require('./data/rankingFreeze.json').frozen === true ? 'true' : 'false')")
          echo "frozen=${FROZEN}" >> "$GITHUB_OUTPUT"
          if [ "$FROZEN" = "true" ]; then
            REASON=$(node -e "const c=require('./data/rankingFreeze.json'); console.log(c.reason ?? '(理由未記載)')")
            {
              echo "### ⚠️ AI RIZINランキングの反映は凍結中です"
              echo "data/rankingFreeze.json の frozen=true により、data/rankings.json 等ランキング4ファイルの再生成・commitをスキップします。"
              echo "理由: ${REASON}"
              echo "fighterRecords.json / fighterRecordsMeta.json の取得は通常どおり継続します。"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Update fighter records
        run: npx tsx scripts/update-fighter-records.ts

      - name: Update mnews rating rankings
        if: steps.freeze_check.outputs.frozen != 'true'
        run: npx tsx scripts/update-mnews-rating.ts

      - name: Commit and push if changed
        env:
          RANKING_FROZEN: ${{ steps.freeze_check.outputs.frozen }}
        run: |
          git config user.name "mnews-bot"
          git config user.email "actions@users.noreply.github.com"

          # data/rankingFreeze.json(frozen=true)の間は、ランキング4ファイル
          # (rankings.json/rankings.prev.json/rankings/archive/rankings.legitimateBaseline.json)
          # の再生成自体を上のステップでスキップしているが、念のためcommit対象からも
          # 明示的に外す(二重の安全網)。fighterRecords.json/fighterRecordsMeta.jsonの
          # 取得・commitはfrozenの影響を受けず常に継続する。
          if [ "$RANKING_FROZEN" = "true" ]; then
            COMMIT_PATHS=(data/fighterRecords.json data/fighterRecordsMeta.json)
          else
            COMMIT_PATHS=(data/fighterRecords.json data/fighterRecordsMeta.json data/rankings.json data/rankings.prev.json data/rankings/archive data/rankings.legitimateBaseline.json)
          fi
          # data/rankings.legitimateBaseline.json: update-mnews-rating.tsのnew-results
          # モード(このジョブの既定実行)は毎回このファイルを前進させて書き出すが、
          # 従来ここのgit add対象に含まれていなかったためコミットされず、CI実行の
          # たびに書き捨てられていた(2026-07-20 19:28以降凍結)。baselineが前進しない
          # と、後日--mode=data-correctionを実行した際のripple検出(auditRankingsRipple)
          # が古い基準と比較し続け、無関係な選手のdeltaまで誤ってゼロに抑制する。
          #
          # data/fighterRecordsMeta.json(2026-08-03追加): update-fighter-records.tsが
          # 毎回generatedAtを書き出すが、このファイルもgit add対象に含まれていなかった。
          # #401(update-org-records.yml)と同型の穴で、pushが競合してrebaseリトライに
          # 入ると、このファイルの変更が未ステージのまま残り「cannot rebase: You have
          # unstaged changes」でジョブが異常終了しうる(このファイルはfighters.ts側の
          # 「データ最終更新」表示に使われる実データのため、out/*.mdの運用ログとは違い
          # commit対象に含めるのが妥当と判断)。
          if ! git diff --quiet -- "${COMMIT_PATHS[@]}"; then
            git add "${COMMIT_PATHS[@]}"
            git commit -m "chore: update fighter records + mnews rating [skip ci]"

            # archive-articles.yml(30分毎にmainへpush)とこのジョブ(所要8.5〜13.8分)の
            # 実行が重なると、pushがnon-fast-forwardで拒否され、計算結果ごと静かに
            # 失われる事故が実際に発生した(2026-07-19・2026-07-31、過去27回中2回)。
            # 対象ファイルが競合しない前提でfetch+rebaseしてリトライする。rebase自体が
            # 競合した場合は異常終了させる(黙って上書き・破棄しない)。
            #
            # --autostash(2026-08-03追加、#401と同じ方針): 上記のfighterRecordsMeta.json
            # 漏れは今回の変更で解消したが、将来同種の書き漏れが再発した場合でも
            # rebase自体が「未ステージの変更がある」というだけで即失敗しないよう、
            # 念のため#401と同じ防御を入れておく。実内容の衝突検出自体は妨げない
            # (衝突時は従来どおりrebase失敗→abort→異常終了する)。
            max_attempts=5
            attempt=1
            until git push; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "::error::push が ${max_attempts} 回連続で失敗しました。競合を解消できないため異常終了します(データは破棄していません。ローカルコミットを確認してください)。"
                exit 1
              fi
              echo "push失敗(試行${attempt}/${max_attempts})。origin/mainを取り込んでrebaseし再試行します。"
              git fetch origin main
              if ! git rebase --autostash origin/main; then
                echo "::error::git rebase が競合しました。手動確認が必要です(黙って上書きしません)。"
                git rebase --abort
                exit 1
              fi
              attempt=$((attempt + 1))
            done
          else
            echo "No changes to commit."
          fi
