name: Archive articles

on:
  schedule:
    # 1日12回(2時間ごと)。Vercelの本番デプロイ回数クォータを消費する
    # mainへのpush頻度を抑えるための間隔(旧: */30 = 1日48回)。
    # archive.jsonはrevalidate:300のraw fetchで読まれ、firstSeenAt(速報
    # 24h判定の起点)への遅延影響は最大2時間程度に収まる想定。
    - cron: "0 */2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run archive script
        run: npx tsx scripts/archive-articles.ts

      - name: Commit and push if changed
        run: |
          git config user.name "mnews-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet -- data/archive.json; then
            git add data/archive.json
            git commit -m "chore: archive new articles [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi
