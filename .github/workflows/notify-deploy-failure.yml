name: Notify on production deploy failure

# Vercelの本番デプロイが失敗(state=failure/error)した直後にIssueで通知する
# 読み取り専用ジョブ。check-org-schedule-diff.ymlと同じ型(open/update/close
# をラベル+タイトルで管理し、data/・src/には一切書き込まない)。
# warm-routes.yml・check-production-robots.ymlと同じくdeployment_statusを
# トリガーにする(こちらはsuccessのみを拾うが、本ワークフローは
# failure/error/successすべてを拾い、success到達でIssueをcloseする)。
#
# 検知できる範囲: 実際にVercelへの新規デプロイが試行され、それが失敗した
# ケースのみ。update-fighter-records.yml/update-org-records.ymlのpredeploy
# ゲート(2026-08-19追加)がcommit/push自体をブロックした場合は新規デプロイが
# 発生しないため、このワークフローでは検知できない(deployment_statusが
# そもそも発生しない)。そちらは各ワークフロー自身のIssue通知
# (labelは同じ"batch-gate-blocked"ではなく別扱い)でカバーする。
on:
  deployment_status:

permissions:
  contents: read
  issues: write

# 短時間に複数のdeployment_statusが連続すると(実測: RIZIN.54の事故では
# 12時間台に6回連続失敗)、Issueのopen/comment/closeが競合しうる。
# check-org-schedule-diff.ymlと同じくグループ化し、後発の実行を打ち切らず
# キューさせる。
concurrency:
  group: notify-deploy-failure
  cancel-in-progress: false

jobs:
  notify:
    if: >-
      (github.event.deployment_status.state == 'failure' || github.event.deployment_status.state == 'error' || github.event.deployment_status.state == 'success') &&
      (github.event.deployment_status.environment == 'Production' || github.event.deployment_status.environment == 'production')
    runs-on: ubuntu-latest
    steps:
      - name: Log trigger (fired, not silently skipped)
        run: |
          echo "notify-deploy-failure fired - state=${{ github.event.deployment_status.state }} deployment=${{ github.event.deployment.id }} sha=${{ github.event.deployment.sha }} environment=${{ github.event.deployment_status.environment }}"

      - name: Open/update/close tracking issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = '本番デプロイが失敗しています';
            const label = 'deploy-failure';
            const state = context.payload.deployment_status.state;
            const sha = context.payload.deployment.sha;
            const shortSha = sha.slice(0, 7);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const commitUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${sha}`;
            const description = context.payload.deployment_status.description || '(説明なし)';
            const targetUrl = context.payload.deployment_status.target_url || '';

            const openIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
              per_page: 100,
            });
            const existing = openIssues.data.find((i) => i.title === title && !i.pull_request);

            if (state === 'success') {
              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body: `デプロイ成功(解消): [${shortSha}](${commitUrl})。 [ワークフロー実行](${runUrl})`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  state: 'closed',
                });
                console.log(`Closed resolved issue #${existing.number}`);
              } else {
                console.log('Deploy succeeded, no existing issue. Nothing to do.');
              }
              return;
            }

            // state is failure or error
            let commitInfo = '(コミット情報取得失敗)';
            try {
              const commit = await github.rest.repos.getCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: sha,
              });
              const msg = commit.data.commit.message.split('\n')[0];
              const author = commit.data.commit.author?.name ?? commit.data.author?.login ?? '(不明)';
              commitInfo = `**${msg}** (${author})`;
            } catch (e) {
              console.log(`Failed to fetch commit info: ${e.message}`);
            }

            const bodyLines = [
              `本番デプロイが失敗しました(state=${state})。`,
              '',
              `- コミット: [${shortSha}](${commitUrl}) ${commitInfo}`,
              `- Vercel: ${description}`,
            ];
            if (targetUrl) bodyLines.push(`- target_url: ${targetUrl}`);
            bodyLines.push(
              '',
              'このコミット自体が原因(例: 日次バッチが取り込んだ新規データがnpm run build側のゲートに触れた)とは限りません。無関係な変更をマージした際に、直前の別コミットが既に壊していたビルドを引き継いだだけの可能性があります。`git log`で直近の変更を確認してください。',
              '',
              `_このIssueは [ワークフロー実行](${runUrl}) により自動生成/更新されました。_`,
            );
            const body = bodyLines.join('\n');

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              console.log(`Commented on existing issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [label],
              });
              console.log(`Created new issue #${created.data.number}`);
            }
